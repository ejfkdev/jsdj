name: CI

on:
  push:
    branches: [main]
    # A tag push runs the same checks, so a release is gated on them even when the
    # tag points at a commit that never went through a PR.
    tags: ['v*']
  pull_request:
    branches: [main]

# A new push to the same branch supersedes the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The floor from package.json `engines`, plus the current LTS and Node's
        # latest, so a change that relies on a newer API is caught here rather than
        # by a user.
        node: ['20', '22', '24']
        os: [ubuntu-latest]
        include:
          # One run on each of the other platforms, on the floor version. Full
          # matrix coverage on all three would be nine runs for a library whose
          # platform-specific code is small.
          - node: '20'
            os: macos-latest
          - node: '20'
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      # Node is set up for the version guarantee: the built output is executed by
      # `node` below, so this matrix is what proves the package works on each
      # supported Node. It is not used to install dependencies — see the bun step.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # Dependencies are installed and the suite is run with bun, because that is
      # what `bun.lock` and the `test` script use. Installing with npm here would
      # both require a package-lock.json that this repository does not have and
      # leave the lockfile untested.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Check the browser entry has no Node builtin
        # The `browser` export must not reach a Node builtin through a static import,
        # or a bundler pulls one into a browser build. A dynamic `import()` inside a
        # function body is fine, and is how the filesystem-backed pieces stay out.
        run: bun run check:browser

      - name: Test
        run: bun test

      # The build output is plain Node ESM, so run one end-to-end command through
      # the matrix's Node rather than bun. This is what catches the package being
      # accidentally dependent on a bun-only API.
      - name: Smoke-test the built CLI under Node
        run: node dist/cli/index.js version