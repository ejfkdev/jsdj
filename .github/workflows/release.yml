name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual re-run, for publishing a tag whose release step failed.
  workflow_dispatch:

permissions:
  contents: read
  # Required for npm provenance: it links the published tarball to this workflow run
  # and its commit, which is what lets a consumer verify the package was built from
  # this repository.
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Verify the tag matches package.json
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="v$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $tag does not match package.json version $version"
            exit 1
          fi
          echo "tag $tag matches package.json"

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Publish
        # `--provenance` publishes a signed attestation of the build. It needs the
        # id-token permission above and a public repository.
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `--generate-notes` builds the changelog from merged PRs and commits since
          # the previous tag.
          gh release create "${GITHUB_REF#refs/tags/}" --generate-notes --verify-tag
