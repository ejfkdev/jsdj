name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual re-run, for publishing a tag whose release step failed.
  workflow_dispatch:

permissions:
  # `write` because the job creates a GitHub release for the tag. With `read` the
  # `gh release create` call fails with "Resource not accessible by integration".
  contents: write
  # Two jobs use this:
  #
  # - npm provenance, which links the published tarball to this workflow run and its
  #   commit so a consumer can verify the package was built from this repository.
  # - Trusted Publishing (OIDC), which lets npm authenticate this workflow directly,
  #   with no long-lived token stored in the repository.
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # `registry-url` is deliberately NOT set. It makes setup-node write an
          # `.npmrc` containing
          #   //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
          # and npm then resolves that placeholder to an empty string, which takes
          # precedence over the OIDC exchange. The publish fails with
          #   404 Not Found - PUT https://registry.npmjs.org/@scope%2fname
          # which reads like a missing package but is actually a failed auth.
          # npm uses the public registry by default, so nothing is needed here.

      # The test script and lockfile are bun's, so the checks run under bun. The
      # publish step below still uses npm: `npm publish` is what understands the
      # OIDC trusted-publisher exchange and `--provenance`.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify the tag matches package.json
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="v$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $tag does not match package.json version $version"
            exit 1
          fi
          echo "tag $tag matches package.json"

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - name: Check what will be published
        run: npm pack --dry-run

      - name: Publish
        # Authentication is Trusted Publishing (OIDC): npm verifies this workflow's
        # id-token against the trusted-publisher connection configured for the
        # package, so there is no long-lived token to leak or rotate.
        #
        # The connection is: package `@ejfkdev/jsdj` → Trusted Publisher →
        # GitHub Actions, org `ejfkdev`, repo `jsdj`, workflow `release.yml`.
        # All three are case-sensitive and must match this file's name exactly.
        #
        # Do not add a `NODE_AUTH_TOKEN` here. An empty or stale token takes
        # precedence over the OIDC exchange and the publish fails with 401/403.
        #
        # `--provenance` additionally publishes a signed attestation linking the
        # tarball to this workflow run and commit.
        run: npm publish --provenance --access public

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `--generate-notes` builds the changelog from merged PRs and commits since
          # the previous tag.
          gh release create "${GITHUB_REF#refs/tags/}" --generate-notes --verify-tag