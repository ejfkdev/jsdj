name: Release

on:
  push:
    tags:
      - 'v*'
  # Manual re-run, for publishing a tag whose release step failed.
  workflow_dispatch:

permissions:
  contents: read
  # Two jobs use this:
  #
  # - npm provenance, which links the published tarball to this workflow run and its
  #   commit so a consumer can verify the package was built from this repository.
  # - Trusted Publishing (OIDC), which lets npm authenticate this workflow directly,
  #   with no long-lived token stored in the repository.
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Verify the tag matches package.json
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="v$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $tag does not match package.json version $version"
            exit 1
          fi
          echo "tag $tag matches package.json"

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check what will be published
        run: npm pack --dry-run

      - name: Publish
        # `--provenance` publishes a signed attestation of the build. It needs the
        # id-token permission above and a public repository.
        #
        # Authentication: once a Trusted Publisher is configured for this package on
        # npmjs.com (package settings → Trusted Publisher → GitHub Actions, org
        # `ejfkdev`, repo `jsdj`, workflow `release.yml`), the OIDC token above is
        # used automatically and `NPM_TOKEN` becomes unnecessary. Until then the
        # granular access token in that secret is what authenticates. Both paths
        # publish identically, so the cutover needs no change here — delete the
        # secret once OIDC is verified working.
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `--generate-notes` builds the changelog from merged PRs and commits since
          # the previous tag.
          gh release create "${GITHUB_REF#refs/tags/}" --generate-notes --verify-tag